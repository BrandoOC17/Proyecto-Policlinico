spring.application.name=policlinico
server.port=8080

# ---- Conexión a MySQL (ajusta usuario y contraseña) ----
spring.datasource.url=jdbc:mysql://localhost:3306/policlinico_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=tu_contraseña

# ---- JPA / Hibernate ----
# La base ya se crea con database/policlinico_db.sql, por eso ddl-auto=none
spring.jpa.hibernate.ddl-auto=none
# Las columnas del script están en camelCase (idEspecialidad...): se respetan tal cual
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=false
server.servlet.session.timeout=30m

