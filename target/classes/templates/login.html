
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">

            <div th:replace="~{fragments/layout :: alertas}"></div>

            <div class="card">
                <div class="card-body p-4">

                    <h4 class="mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                    </h4>

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">
                            <label class="form-label" for="documento">
                                Documento de identidad
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="documento"
                                   name="documento"
                                   th:value="${documento}"
                                   required autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">
                                Contraseña
                            </label>

                            <div class="password-wrapper">
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       required>

                                <button type="button"
                                        class="password-toggle"
                                        onclick="togglePassword()"
                                        aria-label="Mostrar contraseña">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">
                            Ingresar
                        </button>

                    </form>

                    <hr>

                    <p class="mb-0 text-center">
                        ¿Eres paciente nuevo?
                        <a th:href="@{/registro}">Crea tu cuenta</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<style>
    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-right: 45px;
    }

    .password-toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        padding: 5px;
        color: #495057;
        cursor: pointer;
        z-index: 5;
        font-size: 18px;
    }

    .password-toggle:hover {
        color: #0d6efd;
    }

    .password-toggle:focus {
        outline: none;
        box-shadow: none;
    }
</style>

<script>
    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.querySelector('.password-toggle i');
        const button = document.querySelector('.password-toggle');

        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
            button.setAttribute('aria-label', 'Ocultar contraseña');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
            button.setAttribute('aria-label', 'Mostrar contraseña');
        }
    }
</script>

</body>
</html>
