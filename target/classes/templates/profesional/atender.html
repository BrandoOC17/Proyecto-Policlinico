<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar atención')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div class="row justify-content-center"><div class="col-lg-8">
        <div th:replace="~{fragments/layout :: alertas}"></div>
        <div class="card"><div class="card-body p-4">
            <h4 class="mb-3"><i class="bi bi-journal-medical"></i> Registrar atención</h4>
            <dl class="row">
                <dt class="col-sm-3">Paciente</dt><dd class="col-sm-9" th:text="${cita.pacienteNombre}"></dd>
                <dt class="col-sm-3">Documento</dt><dd class="col-sm-9" th:text="${cita.documentoPaciente}"></dd>
                <dt class="col-sm-3">Especialidad</dt><dd class="col-sm-9" th:text="${cita.especialidadNombre}"></dd>
                <dt class="col-sm-3">Fecha y hora</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')} + ' ' + ${#temporals.format(cita.hora, 'HH:mm')}"></dd>
            </dl>
            <form th:action="@{/profesional/citas/{id}/finalizar(id=${cita.id})}" method="post">
                <label class="form-label" for="registroAtencion">Registro de la atención (diagnóstico, indicaciones)</label>
                <textarea class="form-control mb-3" id="registroAtencion" name="registroAtencion" rows="6" required></textarea>
                <button class="btn btn-success" type="submit">Guardar y finalizar cita</button>
                <a class="btn btn-outline-secondary" th:href="@{/profesional/citas}">Volver</a>
            </form>
        </div></div>
    </div></div>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
