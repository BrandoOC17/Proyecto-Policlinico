<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Citas del turno')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-calendar-heart"></i> Citas del turno</h4>
    </div>
    <div class="card"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead><tr>
                <th>N°</th><th>Fecha</th><th>Hora</th><th>Paciente</th><th>Especialidad</th>
                <th>Estado</th><th>Pago</th><th></th>
            </tr></thead>
            <tbody>
            <tr th:each="c : ${citas}">
                <td th:text="${c.id}"></td>
                <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(c.hora, 'HH:mm')}"></td>
                <td th:text="${c.pacienteNombre}"></td>
                <td th:text="${c.especialidadNombre}"></td>
                <td><span th:replace="~{fragments/layout :: estado(${c.estado})}"></span></td>
                <td><span class="badge" th:classappend="${c.pagada} ? 'bg-success' : 'bg-warning text-dark'"
                          th:text="${c.pagada} ? 'Pagada' : 'Pendiente'"></span></td>
                <td class="text-end">
                    <a th:if="${c.estado == 'RESERVADA'}" class="btn btn-success btn-sm"
                       th:href="@{/profesional/citas/{id}/atender(id=${c.id})}">
                        <i class="bi bi-journal-medical"></i> Atender
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}">
                <td colspan="8" class="text-center text-muted py-4">No tienes citas reservadas en tu turno.</td>
            </tr>
            </tbody>
        </table>
    </div></div>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
