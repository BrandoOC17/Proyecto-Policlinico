
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro de paciente')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div th:replace="~{fragments/layout :: alertas}"></div>

            <div class="card">
                <div class="card-body p-4">

                    <h4 class="mb-3">
                        <i class="bi bi-person-plus"></i> Crear cuenta de paciente
                    </h4>

                    <form th:action="@{/registro}" method="post" class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label" for="nombres">Nombres</label>
                            <input class="form-control" id="nombres" name="nombres"
                                   th:value="${f?.nombres}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="apellidos">Apellidos</label>
                            <input class="form-control" id="apellidos" name="apellidos"
                                   th:value="${f?.apellidos}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="documento">Documento de identidad</label>
                            <input class="form-control" id="documento" name="documento"
                                   minlength="8" maxlength="12"
                                   th:value="${f?.documento}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="celular">Celular</label>
                            <input class="form-control" id="celular" name="celular"
                                   pattern="9[0-9]{8}" maxlength="9"
                                   placeholder="9XXXXXXXX"
                                   th:value="${f?.celular}" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label" for="correo">Correo electrónico</label>
                            <input type="email" class="form-control" id="correo"
                                   name="correo" th:value="${f?.correo}" required>
                        </div>

                        <!-- Contraseña -->
                        <div class="col-md-6">
                            <label class="form-label" for="password">Contraseña</label>

                            <div class="password-wrapper">
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       minlength="6"
                                       required>

                                <button type="button"
                                        class="password-toggle"
                                        onclick="togglePassword('password', this)"
                                        aria-label="Mostrar contraseña">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Repetir contraseña -->
                        <div class="col-md-6">
                            <label class="form-label" for="password2">Repite la contraseña</label>

                            <div class="password-wrapper">
                                <input type="password"
                                       class="form-control"
                                       id="password2"
                                       name="password2"
                                       minlength="6"
                                       required>

                                <button type="button"
                                        class="password-toggle"
                                        onclick="togglePassword('password2', this)"
                                        aria-label="Mostrar contraseña">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="col-12">
                            <button class="btn btn-primary" type="submit">
                                Registrarme
                            </button>

                            <a class="btn btn-link" th:href="@{/login}">
                                Ya tengo cuenta
                            </a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<style>
    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-right: 45px;
    }

    .password-toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        padding: 5px;
        color: #495057;
        cursor: pointer;
        z-index: 5;
        font-size: 18px;
    }

    .password-toggle:hover {
        color: #0d6efd;
    }

    .password-toggle:focus {
        outline: none;
        box-shadow: none;
    }
</style>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('i');

        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
            button.setAttribute('aria-label', 'Ocultar contraseña');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
            button.setAttribute('aria-label', 'Mostrar contraseña');
        }
    }
</script>

</body>
</html>
