<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Especialidades y profesionales')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-4">
        <div th:replace="~{fragments/layout :: alertas}"></div>
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5><i class="bi bi-plus-circle"></i> Nueva especialidad</h5>
                        <form th:action="@{/coordinador/especialidades}" method="post" class="row g-2">
                            <div class="col-7"><input class="form-control" name="nombre" placeholder="Nombre" required>
                            </div>
                            <div class="col-5"><input class="form-control" name="tarifa" type="number" step="0.01"
                                    min="0" placeholder="Tarifa S/" required></div>
                            <div class="col-12"><button class="btn btn-primary btn-sm">Agregar</button></div>
                        </form>
                    </div>
                </div>
                <div class="card">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Especialidad</th>
                                    <th>Tarifa (S/)</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${especialidades}">
                                    <td>
                                        <form th:id="'fe' + ${e.id}" th:action="@{/coordinador/especialidades}"
                                            method="post">
                                            <input type="hidden" name="id" th:value="${e.id}">
                                        </form>
                                        <input class="form-control form-control-sm" name="nombre" th:value="${e.nombre}"
                                            th:attr="form='fe' + ${e.id}" required>
                                    </td>
                                    <td><input class="form-control form-control-sm" name="tarifa" type="number"
                                            step="0.01" min="0" th:value="${e.tarifa}" th:attr="form='fe' + ${e.id}"
                                            required></td>
                                    <td class="text-nowrap">
                                        <button class="btn btn-outline-primary btn-sm"
                                            th:attr="form='fe' + ${e.id}">Guardar</button>
                                        <button type="button" class="btn btn-outline-danger btn-sm"
                                            data-bs-toggle="modal" data-bs-target="#modalEliminar"
                                            th:data-nombre="${e.nombre}"
                                            th:data-url="@{/coordinador/especialidades/{id}/eliminar(id=${e.id})}">Eliminar</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <h5>Profesionales de salud</h5>
                <div class="card">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Profesional</th>
                                    <th>Documento</th>
                                    <th>Especialidad</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${profesionales}">
                                    <td th:text="${p.nombreCompleto}"></td>
                                    <td th:text="${p.documento}"></td>
                                    <td>
                                        <form th:id="'fp' + ${p.id}"
                                            th:action="@{/coordinador/profesionales/{id}/especialidad(id=${p.id})}"
                                            method="post"></form>
                                        <select class="form-select form-select-sm" name="idEspecialidad"
                                            th:attr="form='fp' + ${p.id}">
                                            <option th:each="e : ${especialidades}" th:value="${e.id}"
                                                th:text="${e.nombre}" th:selected="${e.id == p.especialidad.id}">
                                            </option>
                                        </select>
                                    </td>
                                    <td><button class="btn btn-outline-primary btn-sm"
                                            th:attr="form='fp' + ${p.id}">Actualizar</button></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(profesionales)}">
                                    <td colspan="4" class="text-center text-muted py-3">Aún no hay profesionales
                                        registrados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de confirmación para eliminar especialidad -->
    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="tituloEliminar" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloEliminar">
                        <i class="bi bi-exclamation-triangle text-danger"></i> Eliminar especialidad
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    ¿Seguro que deseas eliminar la especialidad <strong id="nombreEliminar"></strong>?
                    <div class="text-muted small mt-1">Esta acción no se puede deshacer.</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form id="formEliminar" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: pie}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script>
        document.getElementById('modalEliminar').addEventListener('show.bs.modal', function (ev) {
            var btn = ev.relatedTarget;
            document.getElementById('nombreEliminar').textContent = btn.getAttribute('data-nombre');
            document.getElementById('formEliminar').setAttribute('action', btn.getAttribute('data-url'));
        });
    </script>
</body>

</html>
