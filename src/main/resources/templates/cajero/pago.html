<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar pago')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div class="row justify-content-center"><div class="col-lg-6">
        <div th:replace="~{fragments/layout :: alertas}"></div>
        <div class="card"><div class="card-body p-4">
            <h4 class="mb-3"><i class="bi bi-credit-card"></i> Registrar pago</h4>
            <dl class="row">
                <dt class="col-sm-4">Cita N°</dt><dd class="col-sm-8" th:text="${cita.id}"></dd>
                <dt class="col-sm-4">Paciente</dt><dd class="col-sm-8" th:text="${cita.pacienteNombre}"></dd>
                <dt class="col-sm-4">Documento</dt><dd class="col-sm-8" th:text="${cita.documentoPaciente}"></dd>
                <dt class="col-sm-4">Especialidad</dt><dd class="col-sm-8" th:text="${cita.especialidadNombre}"></dd>
                <dt class="col-sm-4">Profesional</dt><dd class="col-sm-8" th:text="${cita.profesionalNombre}"></dd>
                <dt class="col-sm-4">Fecha y hora</dt>
                <dd class="col-sm-8" th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')} + ' ' + ${#temporals.format(cita.hora, 'HH:mm')}"></dd>
                <dt class="col-sm-4">Monto a cobrar</dt>
                <dd class="col-sm-8 fs-5 fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(cita.tarifa, 1, 'COMMA', 2, 'POINT')}"></dd>
            </dl>
            <form th:action="@{/cajero/pago}" method="post">
                <input type="hidden" name="idCita" th:value="${cita.id}">
                <label class="form-label">Forma de pago</label>
                <div class="mb-3">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="formaPago" id="efectivo" value="EFECTIVO" checked>
                        <label class="form-check-label" for="efectivo">Efectivo</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="formaPago" id="tarjeta" value="TARJETA">
                        <label class="form-check-label" for="tarjeta">Tarjeta</label>
                    </div>
                </div>
                <button class="btn btn-success" type="submit">Registrar pago y emitir comprobante</button>
                <a class="btn btn-outline-secondary" th:href="@{/cajero/pendientes}">Volver</a>
            </form>
        </div></div>
    </div></div>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
