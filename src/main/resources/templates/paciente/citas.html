<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis citas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-calendar-heart"></i> Mis citas</h4>
        <a class="btn btn-primary" th:href="@{/paciente/reservar}"><i class="bi bi-plus-lg"></i> Nueva cita</a>
    </div>
    <div class="card"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead><tr>
                <th>N°</th><th>Fecha</th><th>Hora</th><th>Especialidad</th><th>Profesional</th>
                <th>Estado</th><th>Pago</th><th></th>
            </tr></thead>
            <tbody>
            <tr th:each="c : ${citas}">
                <td th:text="${c.id}"></td>
                <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(c.hora, 'HH:mm')}"></td>
                <td th:text="${c.especialidadNombre}"></td>
                <td th:text="${c.profesionalNombre}"></td>
                <td><span th:replace="~{fragments/layout :: estado(${c.estado})}"></span></td>
                <td>
                    <span th:if="${c.pagada}" class="badge bg-success">Pagada</span>
                    <span th:if="${!c.pagada and c.estado == 'CANCELADA'}" class="badge bg-danger">Cancelado</span>
                    <span th:if="${!c.pagada and c.estado != 'CANCELADA'}" class="badge bg-warning text-dark">Pendiente</span>
                </td>
                <td class="text-end">
                    <button th:if="${c.estado == 'RESERVADA' and !c.pagada}" type="button"
                            class="btn btn-outline-danger btn-sm"
                            data-bs-toggle="modal" data-bs-target="#modalCancelar"
                            th:data-detalle="${c.especialidadNombre} + ' · ' + ${#temporals.format(c.fecha, 'dd/MM/yyyy')} + ' ' + ${#temporals.format(c.hora, 'HH:mm')}"
                            th:data-url="@{/paciente/citas/{id}/cancelar(id=${c.id})}">Cancelar</button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}">
                <td colspan="8" class="text-center text-muted py-4">Aún no tienes citas registradas.</td>
            </tr>
            </tbody>
        </table>
    </div></div>
</main>

<!-- Modal de confirmación para cancelar una cita -->
<div class="modal fade" id="modalCancelar" tabindex="-1" aria-labelledby="tituloCancelar" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloCancelar">
                    <i class="bi bi-exclamation-triangle text-danger"></i> Cancelar cita
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                ¿Seguro que deseas cancelar esta cita?
                <div class="fw-semibold mt-2" id="detalleCancelar"></div>
                <div class="text-muted small mt-1">Esta acción no se puede deshacer.</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Volver</button>
                <form id="formCancelar" method="post" class="m-0">
                    <button type="submit" class="btn btn-danger">Sí, cancelar cita</button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    document.getElementById('modalCancelar').addEventListener('show.bs.modal', function (ev) {
        var btn = ev.relatedTarget;
        document.getElementById('detalleCancelar').textContent = btn.getAttribute('data-detalle');
        document.getElementById('formCancelar').setAttribute('action', btn.getAttribute('data-url'));
    });
</script>
</body>
</html>
