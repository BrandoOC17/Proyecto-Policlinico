<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservar cita')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div th:replace="~{fragments/layout :: alertas}"></div>
            <div class="card"><div class="card-body p-4">
                <h4 class="mb-3"><i class="bi bi-calendar-plus"></i> Reservar cita médica</h4>
                <form th:action="@{/paciente/reservar}" method="post" class="row g-3">
                    <div class="col-12">
                        <label class="form-label" for="idEspecialidad">1. Especialidad</label>
                        <select class="form-select" id="idEspecialidad" name="idEspecialidad" required>
                            <option value="">Seleccione una especialidad</option>
                            <option th:each="e : ${especialidades}" th:value="${e.id}"
                                    th:data-tarifa="${e.tarifa}" th:text="${e.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="idProfesional">2. Profesional de salud</label>
                        <select class="form-select" id="idProfesional" name="idProfesional" required disabled>
                            <option value="">Seleccione un profesional</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="idHorario">3. Horario disponible</label>
                        <select class="form-select" id="idHorario" name="idHorario" required disabled>
                            <option value="">Seleccione un horario</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="alert alert-info mb-0">
                            Tarifa de la consulta: <strong id="tarifa">—</strong>
                            <span class="small d-block">El pago se realiza en la caja del policlínico.</span>
                        </div>
                    </div>
                    <div class="col-12">
                        <button id="btnReservar" class="btn btn-primary" type="submit" disabled>Confirmar reserva</button>
                        <a class="btn btn-outline-primary" th:href="@{/paciente/citas}">Ver mis citas</a>
                    </div>
                </form>
            </div></div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/reservar.js}"></script>
</body>
</html>
